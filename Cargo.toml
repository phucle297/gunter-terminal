[workspace]
members = [
    "crates/gunter-core",
    "crates/gunter-renderer",
    "crates/gunter-term",
    "crates/gunter-input",
    "crates/gunter-app",
]
resolver = "2"

[workspace.dependencies]
vte = "0.13"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
