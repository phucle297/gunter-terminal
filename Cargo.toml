[workspace]
members = [
    "crates/gunter-core",
    "crates/gunter-renderer",
    "crates/gunter-term",
    "crates/gunter-input",
    "crates/gunter-app",
]
resolver = "2"

[workspace.dependencies]
vte = "0.13"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bitflags = "2"
wgpu = "22"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
fontdue = "0.8"
env_logger = "0.11"
arboard = "3"
notify = "6"
libc = "0.2"
